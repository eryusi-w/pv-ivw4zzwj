const LABEL = {"investment":"투자 전략","productivity":"생산성","ai-tools":"AI 도구","other":"기타"};
const state = { source: "all", status: "unpub", archived: false, sel: null };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function filtered() {
  return ITEMS.filter((it) => {
    // 발행된 글·소스 필터 결과는 archive/ 에 보관되므로 자동 포함한다.
    if (!state.archived && it.archived && state.status !== "pub" && state.source === "all") return false;
    if (state.source !== "all" && it.source !== state.source) return false;
    if (state.status === "unpub" && it.published) return false;
    if (state.status === "pub" && !it.published) return false;
    return true;
  });
}

const SOURCE_ORDER = ["productivity", "investment", "ai-tools", "other"];

function renderFilters() {
  const present = new Set(ITEMS.map((i) => i.source));
  const sources = ["all", ...SOURCE_ORDER, ...[...present].filter((s) => !SOURCE_ORDER.includes(s))];

  const f = document.getElementById("filters");
  f.innerHTML =
    sources.map((s) => '<button data-k="source" data-v="' + s + '" class="' + (state.source === s ? "active" : "") + '">' + (s === "all" ? "전체 소스" : LABEL[s] || s) + "</button>").join("") +
    '<button data-k="status" data-v="all" class="' + (state.status === "all" ? "active" : "") + '">전체 상태</button>' +
    '<button data-k="status" data-v="unpub" class="' + (state.status === "unpub" ? "active" : "") + '">미발행</button>' +
    '<button data-k="status" data-v="pub" class="' + (state.status === "pub" ? "active" : "") + '">발행됨</button>' +
    '<label><input type="checkbox" id="arch" ' + (state.archived ? "checked" : "") + '> 아카이브 포함</label>';
  f.querySelectorAll("button").forEach((b) => b.onclick = () => {
    state[b.dataset.k] = b.dataset.v;
    render();
  });
  f.querySelector("#arch").onchange = (e) => { state.archived = e.target.checked; render(); };
}

function badges(it) {
  const out = [];
  out.push('<span class="badge">' + esc(LABEL[it.source] || it.source) + "</span>");
  if (it.published) out.push('<span class="badge pub">발행됨</span>');
  else if (it.draft) out.push('<span class="badge draft">draft</span>');
  if (it.readyOk) out.push('<span class="badge ready">ready ✓</span>');
  if (it.revised) out.push('<span class="badge rev">윤문</span>');
  if (it.archived) out.push('<span class="badge">archive</span>');
  return out.join("");
}

function render() {
  renderFilters();
  const list = filtered();
  document.getElementById("count").textContent = list.length + " / " + ITEMS.length + " 건";
  const el = document.getElementById("list");
  el.innerHTML = list.map((it) =>
    '<div class="item' + (state.sel === it.slug ? " active" : "") + '" data-slug="' + esc(it.slug) + '">' +
    '<div class="t">' + esc(it.title) + "</div>" +
    '<div class="m">' + badges(it) + '<span>' + esc(it.slug) + "</span></div></div>"
  ).join("") || '<div class="empty">조건에 맞는 글이 없습니다</div>';
  el.querySelectorAll(".item").forEach((d) => d.onclick = () => select(d.dataset.slug));
}

function select(slug) {
  const it = ITEMS.find((i) => i.slug === slug);
  if (!it) return;
  state.sel = slug;
  document.querySelectorAll(".item").forEach((d) => d.classList.toggle("active", d.dataset.slug === slug));
  const bar = document.getElementById("bar");
  const links = [];
  if (it.url) links.push('<a href="' + it.url + '" target="_blank">발행글 ↗</a>');
  bar.innerHTML =
    "<strong>" + esc(it.title) + "</strong>" +
    '<span class="badge">' + esc(it.category) + "</span>" +
    (it.tags || []).slice(0, 5).map((t) => '<span class="badge">#' + esc(t) + "</span>").join("") +
    links.join("");
  const frame = document.getElementById("frame");
  if (it.hasPreview) {
    frame.src = slug + "/preview.html";
    frame.style.display = "";
  } else {
    frame.removeAttribute("src");
    frame.style.display = "none";
    bar.innerHTML += ' <span style="color:#b45309">— preview.html 없음</span>';
  }
}

render();
if (ITEMS.length && !ITEMS[0].published) select(ITEMS[0].slug);
</script>
