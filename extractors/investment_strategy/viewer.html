<script>
const ANALYSES = [{"generated_at": "2026-11-20 19:59", "strategy_html": "<h2 id=\"1-3\">1. 종합 요약 (3줄)</h2>\n<ul>\n<li>레버리지 ETF 적립식 투자는 200일 이동평균선과 52주 고점 대비 낙폭 등 기술적 필터를 적용해 원금 손실 위험을 관리해야 합니다(송팀장).</li>\n<li>다음 주(11.23~27) 주요 기업 실적과 미국 인플레이션 데이터 발표를 앞두고 단기 트레이딩 기회와 중장기 기술·에너지 섹터 보유 전략이 병행되어야 합니다(경제사냥꾼).</li>\n<li>비트코인은 향후 1년간 하락장 가능성이 높아 단기 매도/헤지 후, 주요 지지선 확인 시 중장기 매수 전환을 고려하는 전략이 유효합니다(비연세).</li>\n</ul>\n<h2 id=\"2\">2. 공통 테마 (채널들이 공통으로 강조한 것)</h2>\n<ul>\n<li><strong>리스크 관리 및 진입 타이밍의 중요성</strong>: 세 채널 모두 무조건적인 매수/보유가 아닌, <strong>특정 조건(기술적 지표, 이벤트 일정, 사이클 분석) 충족 시 진입</strong>하거나 <strong>헤지/비중 조절</strong>을 통해 하방 리스크를 방어해야 한다는 점을 공통으로 강조합니다.</li>\n<li><strong>단기 변동성 활용 vs 중장기 방향성 설정</strong>: 단기적으로는 이벤트(실적, 지표)나 추세 필터를 활용한 적극적 대응을, 중장기적으로는 자산별 펀더멘털/사이클에 따른 보유 전략을 병행하는 '투트랙 접근'을 제시합니다.</li>\n</ul>\n<h2 id=\"3\">3. 시각 차이 (채널 간 의견이 갈린 부분)</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">구분</th>\n<th style=\"text-align: left;\">송팀장</th>\n<th style=\"text-align: left;\">경제사냥꾼</th>\n<th style=\"text-align: left;\">비연세</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>시장 시각</strong></td>\n<td style=\"text-align: left;\"><strong>Neutral</strong> (레버리지 위험 관리 중심)</td>\n<td style=\"text-align: left;\"><strong>Bullish</strong> (실적/데이터 기대감 반영)</td>\n<td style=\"text-align: left;\"><strong>Bearish</strong> (비트코인 1년 하락장 전망)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>투자 대상</strong></td>\n<td style=\"text-align: left;\">미 나스닥 레버리지/일반 ETF (TQQQ, QLD, QQQ)</td>\n<td style=\"text-align: left;\">국내 반도체 대형주 (삼성전자, SK하이닉스), 에너지</td>\n<td style=\"text-align: left;\">비트코인 (암호화폐 단일 자산)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>단기 전략</strong></td>\n<td style=\"text-align: left;\">기계적 필터(200일선, 낙폭) 충족 시에만 매수</td>\n<td style=\"text-align: left;\">실적 발표 직전 매수 → 발표 직후 1~2일 내 매도</td>\n<td style=\"text-align: left;\">매도(쇼트) 또는 헤지 포지션 구축</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>레버리지/변동성</strong></td>\n<td style=\"text-align: left;\">변동성 감쇠 위험 회피가 최우선 과제</td>\n<td style=\"text-align: left;\">단기 변동성을 이용한 스윙 트레이딩 기회로 활용</td>\n<td style=\"text-align: left;\">극심한 변동성 자체를 리스크로 보고 회피/헤지</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"4\">4. 섹터별 정리</h2>\n<h3 id=\"technology\">Technology (기술)</h3>\n<ul>\n<li><strong>미국 나스닥/반도체 레버리지/일반 ETF</strong>: QQQ, TQQQ, QLD (송팀장)</li>\n<li><em>전략</em>: QQQ 월간 적립 지속, 레버리지(TQQQ, QLD)는 200일선 상위 + 52주 고점 대비 낙폭 기준 충족 시에만 매수.</li>\n<li><strong>국내 반도체 대형주</strong>: 삼성전자, SK하이닉스 (경제사냥꾼)</li>\n<li><em>전략</em>: 다음 주 실적 발표 일정 활용한 단기 스윙(발표 전 매수, 발표 후 익절) 및 3~6개월 이상 중장기 보유 병행.</li>\n</ul>\n<h3 id=\"consumer-discretionary\">Consumer Discretionary (경기소비재)</h3>\n<ul>\n<li><strong>미국 나스닥 구성종목 내 포함</strong>: QQQ, TQQQ, QLD를 통한 간접 투자 (송팀장)</li>\n<li><em>전략</em>: 기술 섹터와 동일하게 레버리지 필터 적용.</li>\n</ul>\n<h3 id=\"energy\">Energy (에너지)</h3>\n<ul>\n<li><strong>에너지 섹터</strong>: 특정 종목 미언급, 섹터 단위 접근 (경제사냥꾼)</li>\n<li><em>전략</em>: 기술 섹터와 유사하게 장기 성장성 고려해 3~6개월 이상 보유 관점 유지.</li>\n</ul>\n<h3 id=\"cryptocurrency\">Cryptocurrency (암호화폐)</h3>\n<ul>\n<li><strong>비트코인 (BTC)</strong>: (비연세)</li>\n<li><em>단기</em>: 하락장 전망 하에 매도(쇼트) 또는 변동성 헤지 전략.</li>\n<li><em>중장기</em>: 주요 지지선에서 반등 확인 시 매수(롱) 전환 후 장기 보유 검토.</li>\n</ul>\n<h2 id=\"5\">5. 종합 투자 전략 (공격형/중립형/보수형으로 구분)</h2>\n<h3 id=\"aggressive-\">공격형 (Aggressive) - 높은 변동성 감내, 단기 수익 추구</h3>\n<ul>\n<li><strong>핵심</strong>: 경제사냥꾼의 단기 이벤트 드리븐 전략 + 비연세의 비트코인 쇼트/헤지 병행.</li>\n<li><strong>실행안</strong>:</li>\n<li><strong>국내 반도체(삼성전자, SK하이닉스)</strong>: 다음 주 실적 발표 1~2일 전 매수 → 발표 당일/익일 목표가 도달 시 전량 매도 (스윙 트레이딩).</li>\n<li><strong>비트코인</strong>: 하락장 베팅(인버스/쇼트) 또는 현물 보유 시 선물 헤지(Short Hedge) 적극 활용.</li>\n<li><strong>레버리지 ETF(TQQQ/QLD)</strong>: 송팀장의 필터(200일선 상위, 낙폭 기준) 통과 시 공격적 비중 확대, 미통과 시 현금 대기.</li>\n<li><strong>유의점</strong>: 실적 미스/데이터 서프라이즈 발생 시 즉각 손절 라인(-3~5%) 설정 필수.</li>\n</ul>\n<h3 id=\"balanced-\">중립형 (Balanced) - 핵심 자산 적립 + 리스크 관리 병행</h3>\n<ul>\n<li><strong>핵심</strong>: 송팀장의 기계적 적립 시스템 + 경제사냥꾼의 중장기 보유 + 비연세의 지지선 대기.</li>\n<li><strong>실행안</strong>:</li>\n<li><strong>핵심 적립(60~70%)</strong>: QQQ(나스닥 100) 월간 정액 적립 지속 (송팀장).</li>\n<li><strong>위성 자산(20~30%)</strong>: <ul>\n<li>국내 반도체(삼성전자, SK하이닉스) 분할 매수로 3~6개월 보유 (경제사냥꾼).</li>\n<li>레버리지 ETF(TQQQ/QLD)는 <strong>200일 이동평균선 상향 돌파 유지 + 52주 고점 대비 -15%~-20% 이내 낙폭</strong> 조건 충족 시에만 추가 매수 (송팀장 필터 엄격 적용).</li>\n</ul>\n</li>\n<li><strong>비트코인(0~10%)</strong>: 현재 비중 축소/관망. 주요 지지선(예: 200주선, 이전 저점) 도달 및 반등 캔들 확인 시 분할 매수 진입 (비연세).</li>\n<li><strong>리밸런싱</strong>: 분기별 1회 비중 점검, 레버리지 비중 15% 초과 시 축소.</li>\n</ul>\n<h3 id=\"conservative-\">보수형 (Conservative) - 원금 보존 최우선, 변동성 최소화</h3>\n<ul>\n<li><strong>핵심</strong>: 레버리지 배제, 현금 비중 확대, 확정적 이벤트 이후 진입.</li>\n<li><strong>실행안</strong>:</li>\n<li><strong>주력(80%+)</strong>: QQQ 또는 S&amp;P500 일반 ETF(SPY/IVV 등) 월간 적립만 수행. 레버리지 ETF(TQQQ, QLD) <strong>완전 배제</strong> (송팀장 리스크 경고 수용).</li>\n<li><strong>대기 자금(20% 이하)</strong>: <ul>\n<li>국내 반도체: 실적 발표 <strong>이후</strong> 주가 안정화 확인 시(변동성 축소 후) 분할 매수 진입.</li>\n<li>에너지 섹터: ETF(KODEX 미국에너지 등) 활용해 저가 매수 기회 포착.</li>\n</ul>\n</li>\n<li><strong>비트코인</strong>: <strong>투자 배제</strong> 또는 포트폴리오 1~2% 이내 극소액만 장기 관점(4년 사이클)으로 방치 (비연세 하락장 전망 반영).</li>\n<li><strong>원칙</strong>: \"모르는 구간에서는 현금이 최고의 헤지\" 원칙 고수.</li>\n</ul>\n<h2 id=\"6\">6. 리스크 및 유의사항</h2>\n<ul>\n<li><strong>레버리지 ETF 구조적 리스크 (송팀장)</strong>: 횡보/하락장에서</li>\n</ul>", "channels": [{"name": "송팀장", "handle": "@Song_Teamjang", "url": "https://www.youtube.com/@Song_Teamjang", "videos": [{"thesis": "레버리지 ETF(특히 TQQQ, QLD)에 월간 적립을 할 때는 단순한 추세 필터(200일선 상위 및 52주 고점 대비 낙폭 기준)를 적용하면 원금 손실 위험을 크게 줄일 수 있다.", "key_points": ["QQQ에 대한 월간 적립은 타이밍과 상관없이 안정적이며, RSI·VIX·짧은 이동평균선 같은 지표는 필요 없다.", "TQQQ 같은 레버리지 ETF는 무조건 매수 시 34% 정도의 원금 미달 위험이 있지만, 200일선 위에 있을 때만 매수하는 규칙을 적용하면 5% 이하로 감소한다.", "VIX·RSI·짧은 이동평균선은 오히려 원금 미달을 늘리는 부정적 지표이며, 52주 고점 대비 낙폭과 200일선이 가장 효과적이다."], "sectors": ["Technology", "Consumer Discretionary"], "stocks": ["QQQ", "TQQQ", "QLD"], "strategy_short": "레버리지 ETF는 200일선 상위이면서 52주 고점 대비 낙폭이 일정 수준 이하일 때만 매수한다.", "strategy_long": "QQQ에 월간 적립을 지속하고, 레버리지 ETF는 200일선과 const SENTIMENT_KO = { bullish: "강세", bearish: "약세", neutral: "중립" };
const SENTIMENT_CLASS = { bullish: "bullish", bearish: "bearish", neutral: "neutral" };

let analysisIdx = 0;
let channel = "__home__";

const dateSelect = document.getElementById('dateSelect');
const channelList = document.getElementById('channelList');
const main = document.getElementById('main');
const resultCount = document.getElementById('resultCount');

function current() { return ANALYSES[analysisIdx]; }

function populateDates() {
  dateSelect.innerHTML = ANALYSES.map((a, i) =>
    `<option value="${i}">${a.generated_at}</option>`).join('');
  dateSelect.value = analysisIdx;
}

function videosFor(name) {
  const a = current();
  return a.channels.filter(c => c.name === name)
    .flatMap(c => c.videos || []);
}

function channelUrl(name) {
  const found = ALL_CHANNELS.find(c => c.name === name);
  return found ? found.url : "";
}

function populateChannels() {
  const items = [{ key: "__home__", label: "🏠 종합 전략" }]
    .concat(ALL_CHANNELS.map(c => ({
      key: c.name,
      label: c.name,
      count: videosFor(c.name).length,
    })));

  if (channel !== "__home__" && !ALL_CHANNELS.some(c => c.name === channel)) {
    channel = "__home__";
  }

  channelList.innerHTML = items.map(it => `
    <div class="channel-item ${it.key === channel ? 'active' : ''}" data-ch="${esc(it.key)}">
      <span>${esc(it.label)}</span>
      ${it.count != null ? `<span class="badge">${it.count}</span>` : ''}
    </div>`).join('');
  channelList.querySelectorAll('.channel-item').forEach(el => {
    el.onclick = () => { channel = el.dataset.ch; refreshChannelsOnly(); };
  });
}

function refreshChannelsOnly() {
  populateChannels();
  render();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function asList(v) {
  if (Array.isArray(v)) return v;
  if (v == null || v === '') return [];
  return [String(v)];
}

function renderVideo(v) {
  const sent = (v.sentiment || '').toLowerCase();
  const sentClass = SENTIMENT_CLASS[sent] || 'other';
  const sentLabel = SENTIMENT_KO[sent] || v.sentiment || '-';
  const sectors = asList(v.sectors).map(s => `<span class="tag">${esc(s)}</span>`).join('');

  const points = asList(v.key_points);
  const risks = asList(v.risks);
  return `

    ${stocks ? `<div class="field"><div class="label">종목</div><div class="tags">${stocks}</div></div>` : ''}
    ${v.strategy_short ? `<div class="field"><div class="label">단기 전략</div><p>${esc(v.strategy_short)}</p></div>` : ''}
    ${v.strategy_long ? `<div class="field"><div class="label">중장기 전략</div><p>${esc(v.strategy_long)}</p></div>` : ''}
    ${risks.length ? `<div class="field"><div class="label">리스크</div>

    const url = channelUrl(name);
    html += `
      <div class="channel-head">
        <span class="name">${esc(name)}</span>
        <span class="ch-url">${url ? `<a href="${esc(url)}" target="_blank">채널 페이지 ↗</a>` : ''}</span>
      </div>`;
    if (!videos.length) {
      html += `<div class="empty" style="margin-bottom:1rem">분석된 영상이 없습니다.</div>`;
    } else {
      html += videos.map(renderVideo).join('');
    }
  }

  main.innerHTML = html;
  resultCount.textContent = `영상 ${total}건`;
}

function refresh() {
  populateDates();
  populateChannels();
  render();
}

dateSelect.onchange = () => { analysisIdx = +dateSelect.value; refresh(); };

refresh();
</script>
</body>
</html>
